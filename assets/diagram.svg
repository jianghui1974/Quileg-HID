<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="dgTitle dgDesc" width="1200" height="500">
  <title id="dgTitle">Quileg HID 工作链路</title>
  <desc id="dgDesc">iPhone 通过 AirPlay 把画面投给 Mac；Mac 通过 Wi-Fi 指挥 ESP32-S3 板子；板子以蓝牙键鼠身份操作 iPhone。</desc>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6bff"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7a29"/>
    </marker>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf1ff"/>
      <stop offset="1" stop-color="#dbe7ff"/>
    </linearGradient>
  </defs>

  <!-- ============ iPhone ============ -->
  <g>
    <rect x="120" y="150" width="180" height="300" rx="34" fill="#fff" stroke="#0b2a5b" stroke-width="2.5"/>
    <rect x="133" y="182" width="154" height="236" rx="14" fill="url(#screenGrad)"/>
    <rect x="182" y="160" width="56" height="11" rx="5.5" fill="#0b2a5b"/>
    <rect x="182" y="432" width="56" height="5" rx="2.5" fill="#c9d4e4"/>

    <g fill="#9db6dd">
      <rect x="152" y="206" width="26" height="26" rx="6"/>
      <rect x="186" y="206" width="26" height="26" rx="6"/>
      <rect x="220" y="206" width="26" height="26" rx="6"/>
      <rect x="152" y="240" width="26" height="26" rx="6"/>
      <rect x="186" y="240" width="26" height="26" rx="6"/>
      <rect x="220" y="240" width="26" height="26" rx="6"/>
      <rect x="152" y="274" width="26" height="26" rx="6"/>
      <rect x="186" y="274" width="26" height="26" rx="6"/>
      <rect x="220" y="274" width="26" height="26" rx="6"/>
    </g>

    <text x="210" y="480" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#0b2a5b">iPhone</text>
  </g>

  <!-- ============ Mac ============ -->
  <g>
    <rect x="880" y="140" width="240" height="170" rx="12" fill="#0e1c33" stroke="#0b2a5b" stroke-width="2.5"/>
    <rect x="898" y="158" width="204" height="134" rx="6" fill="#16283f"/>

    <rect x="912" y="174" width="112" height="102" rx="5" fill="#1f6bff" opacity="0.55"/>
    <rect x="1032" y="174" width="56" height="46" rx="5" fill="#3a4f6b"/>
    <rect x="1032" y="228" width="56" height="48" rx="5" fill="#3a4f6b"/>

    <path d="M 856 310 L 1144 310 L 1122 336 L 878 336 Z" fill="#e6ecf5" stroke="#c9d4e4" stroke-width="2"/>
    <rect x="966" y="310" width="68" height="6" rx="3" fill="#c9d4e4"/>

    <text x="1000" y="378" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#0b2a5b">Mac</text>
  </g>

  <!-- ============ ESP32-S3 板子 ============ -->
  <g>
    <rect x="500" y="300" width="200" height="132" rx="12" fill="#10161f" stroke="#2a3646" stroke-width="2"/>

    <g fill="#e8b44a">
      <rect x="486" y="322" width="14" height="18" rx="3"/>
      <rect x="486" y="352" width="14" height="18" rx="3"/>
      <rect x="486" y="382" width="14" height="18" rx="3"/>
      <rect x="700" y="322" width="14" height="18" rx="3"/>
      <rect x="700" y="352" width="14" height="18" rx="3"/>
      <rect x="700" y="382" width="14" height="18" rx="3"/>
    </g>

    <rect x="572" y="292" width="56" height="16" rx="5" fill="#9aa5b4"/>
    <rect x="548" y="330" width="104" height="58" rx="6" fill="#1c2836" stroke="#2f4056" stroke-width="1.5"/>
    <circle cx="524" cy="404" r="8" fill="none" stroke="#e8b44a" stroke-width="2.5"/>
    <circle cx="524" cy="404" r="2.5" fill="#e8b44a"/>
    <circle cx="672" cy="312" r="4" fill="#42d392"/>

    <text x="600" y="454" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#0b2a5b">ESP32-S3</text>
  </g>

  <!-- ============ 看：AirPlay（上） ============ -->
  <path d="M 215 145 C 430 38, 780 38, 976 135"
        fill="none" stroke="#1f6bff" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowBlue)"/>
  <rect x="540" y="26" width="120" height="30" rx="15" fill="#fff" stroke="#cfe0ff" stroke-width="1.5"/>
  <text x="600" y="46" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#0b57d0">AirPlay</text>
  <circle cx="600" cy="96" r="14" fill="#1f6bff"/>
  <text x="600" y="101" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">1</text>

  <!-- ============ 做：Wi-Fi 指挥（右下） ============ -->
  <path d="M 876 286 C 820 292, 762 316, 710 342"
        fill="none" stroke="#ff7a29" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <rect x="762" y="252" width="86" height="30" rx="15" fill="#fff" stroke="#ffd5b8" stroke-width="1.5"/>
  <text x="805" y="272" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#b4530f">Wi-Fi</text>
  <circle cx="852" cy="330" r="14" fill="#ff7a29"/>
  <text x="852" y="335" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">2</text>

  <!-- ============ 做：BLE 键鼠（左下） ============ -->
  <path d="M 494 372 C 430 376, 360 392, 306 404"
        fill="none" stroke="#ff7a29" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <rect x="352" y="336" width="100" height="30" rx="15" fill="#fff" stroke="#ffd5b8" stroke-width="1.5"/>
  <text x="402" y="356" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#b4530f">BLE HID</text>
  <circle cx="452" cy="398" r="14" fill="#ff7a29"/>
  <text x="452" y="403" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">3</text>
</svg>
